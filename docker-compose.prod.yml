# =============================================================================
# AquaFlow Backend — Production Docker Compose
# Deploy on HostHatch VPS (agama-core) alongside GLPI, Vaultwarden, Hani Bot
# Reverse Proxy & HTTPS handled by host nginx.service -> 127.0.0.1:8082
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aquaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aquaflow}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres} -d ${POSTGRES_DB:-aquaflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aquaflow-net

  # ---------------------------------------------------------------------------
  # Mosquitto MQTT Broker
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aquaflow-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwords:/mosquitto/config/passwords:ro
      - ./mosquitto/config/acls:/mosquitto/config/acls:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 5"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    networks:
      - aquaflow-net

  # ---------------------------------------------------------------------------
  # AquaFlow Spring Boot Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: aquaflow-backend:latest
    container_name: aquaflow-backend
    restart: unless-stopped
    ports:
      # Port 8082 on localhost to avoid conflict with GLPI (8080) and Vaultwarden (8081)
      - "127.0.0.1:${SERVER_PORT:-8082}:8080"
    secrets:
      - db_password
      - jwt_secret
      - webhook_secret
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/aquaflow}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/db_password
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mosquitto:1883}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      LORAWAN_WEBHOOK_SECRET: ${LORAWAN_WEBHOOK_SECRET:-}
      LORAWAN_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ARVACORE_GATEWAY_INGEST_KEY: ${ARVACORE_GATEWAY_INGEST_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://api-aquaflow.gladwindr.me,https://arvacore.gladwindr.me,https://*.gladwindr.me,https://*.vercel.app,http://localhost:3000,http://localhost:5173}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-WARN}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      TZ: Asia/Manila
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - aquaflow-net

# =============================================================================
# Secrets (file-based, never hardcoded)
# =============================================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  webhook_secret:
    file: ./secrets/webhook_secret.txt

# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

# =============================================================================
# Isolated Network (does not affect GLPI, Vaultwarden, Hani Bot)
# =============================================================================
networks:
  aquaflow-net:
    name: aquaflow-net
    driver: bridge
