# =============================================================================
# Mosquitto MQTT Broker — Production Configuration (ArvaCore Eco-System)
# =============================================================================

# Default standard port (internal container network listener)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls

# Secure TLS Listener for Remote ArvaNode Connections
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls
# In production on VPS with TLS certs configured:
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# cafile /mosquitto/certs/ca.crt

# WebSocket listener (for browser-based clients & telemetry monitoring)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
